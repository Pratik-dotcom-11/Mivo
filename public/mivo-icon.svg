<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mivoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C85A32" />
      <stop offset="45%" stop-color="#DE6B42" />
      <stop offset="100%" stop-color="#F4A261" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="mivoGloss" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Waveform Pill Gradient -->
    <linearGradient id="mivoWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF2E8" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="mivoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#C85A32" flood-opacity="0.38" />
    </filter>

    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect
    x="16"
    y="16"
    width="168"
    height="168"
    rx="42"
    ry="42"
    fill="url(#mivoBgGrad)"
    filter="url(#mivoShadow)"
  />

  <!-- Subtle Inner Border -->
  <rect
    x="16.75"
    y="16.75"
    width="166.5"
    height="166.5"
    rx="41.25"
    ry="41.25"
    fill="none"
    stroke="url(#mivoGloss)"
    stroke-width="1.5"
  />

  <!-- Top Gloss Arc -->
  <path
    d="M 28 60 C 28 38, 44 22, 66 22 L 134 22 C 156 22, 172 38, 172 60 C 145 74, 55 74, 28 60 Z"
    fill="url(#mivoGloss)"
    opacity="0.5"
  />

  <!-- Soundwave forming stylized "M" with rounded pill bars -->
  <g filter="url(#waveGlow)" fill="url(#mivoWaveGrad)">
    <!-- Outer Left Pill -->
    <rect x="52" y="75" width="11" height="50" rx="5.5" />
    <!-- Inner Left Pill -->
    <rect x="71" y="90" width="11" height="35" rx="5.5" />
    <!-- Center Peak Pill (Voice Apex) -->
    <rect x="90" y="58" width="11" height="84" rx="5.5" />
    <!-- Inner Right Pill -->
    <rect x="109" y="90" width="11" height="35" rx="5.5" />
    <!-- Outer Right Pill -->
    <rect x="128" y="75" width="11" height="50" rx="5.5" />

    <!-- Flanking Voice Cadence Dots -->
    <circle cx="39" cy="100" r="4.5" />
    <circle cx="152" cy="100" r="4.5" />
  </g>

  <!-- AI Intelligence Star (Top Right) -->
  <path
    d="M 148 40 Q 148 48 140 48 Q 148 48 148 56 Q 148 48 156 48 Q 148 48 148 40 Z"
    fill="#FFFFFF"
    opacity="0.95"
  />
</svg>
